<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Team unjargon agent architecture</title>
  <desc id="desc">Privacy-preserving local candidate detection flows to the autonomous Team unjargon agent on Cloud Run, which uses Google ADK and Gemini with Firestore to provide a personal learning inbox and an opt-in team glossary.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#102647"/></linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#3975d6"/><stop offset="1" stop-color="#7b5bc7"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".22"/></filter>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 Z" fill="#7fc8ff"/></marker>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1480" cy="95" r="310" fill="#5a61ca" opacity=".14"/><circle cx="85" cy="800" r="270" fill="#16a6b8" opacity=".09"/>
  <text x="80" y="82" font-family="Arial, Helvetica, sans-serif" font-size="47" font-weight="700" fill="#f7fbff">Team unjargon agent</text>
  <text x="80" y="122" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#b8cae2">Autonomous, privacy-preserving jargon learning for teams</text>

  <g filter="url(#shadow)">
    <rect x="80" y="205" width="310" height="235" rx="22" fill="#101d30" stroke="#4b759e" stroke-width="2"/>
    <text x="115" y="258" font-family="Arial, Helvetica, sans-serif" font-size="20" letter-spacing="2.4" fill="#91bfe5">PERSONAL AI AGENTS</text>
    <text x="115" y="315" font-family="Arial, Helvetica, sans-serif" font-size="35" font-weight="700" fill="#fff">Claude Code</text>
    <text x="115" y="361" font-family="Arial, Helvetica, sans-serif" font-size="35" font-weight="700" fill="#fff">Codex</text>
    <text x="115" y="405" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#b8cae2">Assistant output stays local</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="470" y="205" width="310" height="235" rx="22" fill="#102a39" stroke="#48aebe" stroke-width="2"/>
    <text x="505" y="258" font-family="Arial, Helvetica, sans-serif" font-size="20" letter-spacing="2.4" fill="#80d9df">LOCAL BRIDGE</text>
    <text x="505" y="314" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#fff">Conservative detector</text>
    <text x="505" y="359" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#c9e6e9">candidate term + source</text>
    <rect x="505" y="381" width="232" height="33" rx="16" fill="#183e4a"/>
    <text x="521" y="404" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#a4edf0">NO transcripts or paths</text>
  </g>
  <path d="M390 322 H455" stroke="#7fc8ff" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M780 322 H860" stroke="#7fc8ff" stroke-width="5" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="880" y="165" width="630" height="350" rx="28" fill="url(#hero)" stroke="#a9c8ff" stroke-width="2"/>
    <text x="925" y="225" font-family="Arial, Helvetica, sans-serif" font-size="20" letter-spacing="2.6" fill="#e1ecff">GOOGLE CLOUD RUN</text>
    <text x="925" y="281" font-family="Arial, Helvetica, sans-serif" font-size="39" font-weight="700" fill="#fff">Team unjargon agent</text>
    <line x1="925" y1="310" x2="1465" y2="310" stroke="#dceaff" opacity=".46"/>
    <rect x="925" y="337" width="255" height="131" rx="15" fill="#10244d" opacity=".8"/>
    <text x="950" y="376" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#fff">Autonomous triage</text>
    <text x="950" y="413" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#dbe7ff">reuse opt-in knowledge</text>
    <text x="950" y="441" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#dbe7ff">or create a review task</text>
    <rect x="1205" y="337" width="260" height="131" rx="15" fill="#3f276b" opacity=".86"/>
    <text x="1230" y="376" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#fff">Google ADK</text>
    <text x="1230" y="413" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#efe5ff">Gemini 3.5 Flash-Lite</text>
    <text x="1230" y="441" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#efe5ff">Vertex AI · global endpoint</text>
  </g>

  <path d="M1195 515 V590" stroke="#7fc8ff" stroke-width="5" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <rect x="980" y="610" width="430" height="145" rx="22" fill="#1a273a" stroke="#5b8cca" stroke-width="2"/>
    <text x="1016" y="656" font-family="Arial, Helvetica, sans-serif" font-size="19" letter-spacing="2.1" fill="#9dc7fb">FIRESTORE</text>
    <text x="1016" y="703" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#fff">Opt-in shared glossary</text>
    <text x="1016" y="735" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#c1d2eb">terms, task state, explicit feedback only</text>
  </g>

  <path d="M1040 755 C940 824, 720 815, 548 742" fill="none" stroke="#7fc8ff" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M1345 755 C1390 818, 1475 808, 1500 730" fill="none" stroke="#7fc8ff" stroke-width="5" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <rect x="80" y="595" width="440" height="200" rx="22" fill="#16273b" stroke="#6194bd" stroke-width="2"/>
    <text x="115" y="641" font-family="Arial, Helvetica, sans-serif" font-size="19" letter-spacing="2.1" fill="#a6cbe8">PERSONAL LEARNING</text>
    <text x="115" y="692" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#fff">New jargon inbox</text>
    <text x="115" y="729" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#c9d8e8">Explain on demand, then choose</text>
    <text x="115" y="759" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#c9d8e8">whether to share with teammates.</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1095" y="785" width="405" height="85" rx="20" fill="#283251" stroke="#9f8ce6" stroke-width="2"/>
    <text x="1124" y="820" font-family="Arial, Helvetica, sans-serif" font-size="19" letter-spacing="1.7" fill="#d3c5ff">EXPLICIT TEAM SHARING</text>
    <text x="1124" y="850" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#fff">Markdown export / import</text>
  </g>
  <text x="80" y="855" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#8fa7c4">Privacy boundary: no raw conversation, prompt, session ID, path, or original imported Markdown is retained.</text>
</svg>
